# The local gate on GitHub: `make check` (black, tests with the coverage gate, pip-audit) on every push to master and
# every pull request, and weekly, so a new advisory against an unchanged lock still turns it red.
#
# 🛑 Supply chain policy:
#   - every action is pinned by COMMIT SHA (a tag is mutable); the tag is in the trailing comment, and Dependabot
#     (.github/dependabot.yml) moves both together, after the same 7-day cooldown;
#   - uv is pinned (the version energy-optimizer's images install); the lock is installed `--frozen`: CI never
#     resolves anything.
name: check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC — the audit half is what this is for
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          # the interpreter comes from .python-version, as it does locally
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: make sync (frozen lock)
        run: make sync
      - name: make check
        run: make check
