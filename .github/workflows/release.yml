# A published release gets truenas.zip — what HACS installs (hacs.json: zip_release). The tag is stamped into
# manifest.json's version first. No third-party actions: the zip is uploaded with the runner's own gh.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # to attach the asset to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the version and zip the integration
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          p = pathlib.Path("custom_components/truenas/manifest.json")
          m = json.loads(p.read_text())
          version = os.environ["TAG"].removeprefix("v")
          # Home Assistant refuses a manifest version it cannot parse: a tag like "beta" must fail HERE
          if not re.fullmatch(r"\d+\.\d+\.\d+([.-]?[0-9A-Za-z.]+)?", version):
              raise SystemExit(f"release tag {os.environ['TAG']!r} is not a version (expected v1.2.3)")
          m["version"] = version
          p.write_text(json.dumps(m, indent=4) + "\n")
          print("version", m["version"])
          PY
          cd custom_components/truenas && zip -r ../../truenas.zip . -x '__pycache__/*'
      - name: Attach truenas.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" truenas.zip --clobber --repo "$GITHUB_REPOSITORY"
